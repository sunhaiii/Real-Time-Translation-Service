services:
  backend:
    build:
      context: ./app_root/backend
      dockerfile: Dockerfile
    container_name: translation-backend
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - FRONTEND_URL=http://localhost:3000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./app_root/backend:/app
      - ./app_root/backend/.env:/app/.env
    restart: unless-stopped
    networks:
      - translation-network

  frontend:
    build:
      context: ./app_root/frontend
      dockerfile: Dockerfile
    container_name: translation-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001
    restart: unless-stopped
    networks:
      - translation-network
    depends_on:
      - backend

networks:
  translation-network:
    driver: bridge

